/* ── Framer Motion with graceful fallback ─────────────────────────── */
const FM = window.Motion || window.FramerMotion || {};
const MOTION_KEYS = new Set(['initial','animate','exit','whileHover','whileTap','whileInView',

const motion = FM.motion || new Proxy({}, {
  get: (_, tag) => ({ children, style, className, ...rest }) => {

    return React.createElement(tag, { className, style, ...clean }, children);

/* ── Cursor ───────────────────────────────────────────────────────── */
function Cursor() {
  const dot = useRef(null), ring = useRef(null);
  useEffect(() => {
    let rx = 0, ry = 0, tx = 0, ty = 0, raf;
    const move = e => {
      tx = e.clientX; ty = e.clientY;
      if (dot.current) dot.current.style.transform = `translate(${tx}px,${ty}px)`;
      const hot = e.target.closest('[data-hot]');
      if (ring.current) ring.current.classList.toggle('hot', !!hot);
    };
    const loop = () => {
      rx += (tx - rx) * .16; ry += (ty - ry) * .16;
      if (ring.current) ring.current.style.transform = `translate(${rx}px,${ry}px)`;
      raf = requestAnimationFrame(loop);
    };
    window.addEventListener('mousemove', move); loop();
    return () => { window.removeEventListener('mousemove', move); cancelAnimationFrame(raf); };
  }, []);
  return <><div ref={ring} className="cursor-ring"/><div ref={dot} className="cursor-dot"/></>;
}

/* ── Scroll reveal ────────────────────────────────────────────────── */
function useReveal(threshold = .18) {
  const ref = useRef(null); const [on, setOn] = useState(false);
  useEffect(() => {
    if (!ref.current) return;
    const io = new IntersectionObserver(([e]) => e.isIntersecting && setOn(true), { threshold });
    io.observe(ref.current); return () => io.disconnect();
  }, [threshold]);
  return [ref, on];
}

/* ── Count-up ─────────────────────────────────────────────────────── */
function Counter({ to, dur = 1500, suffix = '', decimals = 0 }) {
  const [ref, on] = useReveal(.4); const [v, setV] = useState(0);
  useEffect(() => {
    if (!on) return; let s = null, raf;
    const step = t => {
      if (!s) s = t;
      const p = Math.min((t - s) / dur, 1);
      setV(to * (1 - Math.pow(1 - p, 3)));
      if (p < 1) raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step); return () => cancelAnimationFrame(raf);
  }, [on, to, dur]);
  return <span ref={ref}>{v.toFixed(decimals)}{suffix}</span>;
}

const TREE = [
  { id:'ingest', x:60,  y:150, label:'trace ingested',    detail:'6 steps · 2 errors' },
  { id:'pros',   x:250, y:70,  label:'prosecutor',        detail:'systemic fault' },
  { id:'def',    x:250, y:230, label:'defender',          detail:'external cause' },
  { id:'cor',    x:450, y:150, label:'coroner',           detail:'evidence only' },
  { id:'surg',   x:640, y:70,  label:'surgeon',           detail:'clause inserted' },
  { id:'led',    x:640, y:230, label:'ledger',            detail:'signature stored' },
];
const EDGES = [['ingest','pros'],['ingest','def'],['pros','cor'],['def','cor'],['cor','surg'],['cor','led']];

const DEMO_LOG = [
  { t:'sys',  s:'boot',   text:'aase.intercept(agent_07) — trace captured' },
  { t:'dim',  s:'boot',   text:'6 steps · error at step 5 · no ledger match' },
  { t:'pros', s:'pros',   text:'PROSECUTOR — steps 2 through 5 issue an identical query against a tool returning the same ambiguity signal. No termination rule exists in the prompt.' },
  { t:'def',  s:'def',    text:'DEFENDER — the CRM returned ambiguity without distinguishing fields. The agent had nothing new to work with between attempts.' },
  { t:'cor',  s:'cor',    text:'CORONER — four byte-identical calls, zero variation, step 6 confirms no progress. Decision order step 3 applies.' },
  { t:'verd', s:'cor',    text:'FAILURE_TYPE: reasoning_loop' },
  { t:'surg', s:'surg',   text:'SURGEON — inserting loop guard clause into system prompt' },
  { t:'ok',   s:'surg',   text:'+ If an action returns the same result twice, do not repeat it. Refine the query or stop and report.' },
  { t:'led',  s:'led',    text:'LEDGER — signature embedded and persisted · repair #324' },
  { t:'done', s:'led',    text:'agent_07 repaired · immune to this signature' },
];

function LiveAgent() {
  const [ref,on]     = useReveal(.25);
  const [running,setRunning] = useState(false);
  const [lines,setLines]     = useState([]);
  const [stage,setStage]     = useState(null);
  const [done,setDone]       = useState([]);
  const [backend,setBackend] = useState('checking');
  const [elapsed,setElapsed] = useState(0);
  const logRef = useRef(null);

  useEffect(()=>{
    let dead=false;
    fetch('http://127.0.0.1:8000/api/system')
      .then(r=>r.ok?r.json():Promise.reject())
      .then(d=>{ if(!dead) setBackend(d); })
      .catch(()=>{ if(!dead) setBackend('offline'); });
    return ()=>{dead=true;};
  },[]);

  useEffect(()=>{ if(on && !running && lines.length===0) start(); },[on]);
  useEffect(()=>{ if(logRef.current) logRef.current.scrollTop = logRef.current.scrollHeight; },[lines]);

  const start = useCallback(()=>{
    setRunning(true); setLines([]); setDone([]); setStage(null); setElapsed(0);
    const t0 = Date.now();
    const timer = setInterval(()=>setElapsed((Date.now()-t0)/1000),100);
    DEMO_LOG.forEach((l,i)=>{
      setTimeout(()=>{
        setLines(p=>[...p,l]);
        setStage(l.s);
        setDone(p=>p.includes(l.s)?p:[...p,l.s]);
        if(i===DEMO_LOG.length-1){ clearInterval(timer); setRunning(false); setStage('done'); }
      }, 620*i + 400);
    });
  },[]);

  const isLive = backend && backend !== 'offline' && backend !== 'checking';

  return (
    <section id="live" ref={ref} className="relative overflow-hidden border-y border-white/[.06] bg-ink/45">
      <div className="absolute inset-0 mesh opacity-30"/>
      <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[900px] h-[520px] rounded-full blur-[150px] opacity-[.13]"
           style={{background:'radial-gradient(circle,#4FACFE,transparent 68%)'}}/>

      <div className="relative max-w-[1500px] mx-auto px-6 md:px-10 py-28 md:py-40">
        <div className="flex flex-wrap items-end justify-between gap-8 mb-14">
          <div>
            <div className="flex items-center gap-4 mb-6">
              <span className="font-mono text-[10px] tracking-ultra text-neon">§ 02</span>
              <span className="w-10 h-px bg-neon/40"/>
              <span className="font-mono text-[10px] tracking-ultra text-smoke">LIVE AGENT SIMULATION</span>
            </div>
            <h2 className="font-display text-bone leading-[.94] tracking-[-.02em] text-[clamp(2.3rem,6vw,5rem)]">
              An agent breaks.<br/><span className="grad-text">It repairs itself.</span>
            </h2>
          </div>

          <div className="flex items-center gap-4">
            <span className={`flex items-center gap-2.5 px-3.5 py-2 rounded-full border font-mono text-[10px] tracking-[.14em]
              ${isLive ? 'border-emerald-400/40 text-emerald-400 bg-emerald-400/[.06]'
                       : 'border-flare/40 text-flare bg-flare/[.06]'}`}>
              <span className={`w-1.5 h-1.5 rounded-full ${isLive?'bg-emerald-400':'bg-flare'} animate-pulse`}/>
              {backend==='checking' ? 'PROBING BACKEND…' : isLive ? `LIVE · ${backend.pool_total} TRACES` : 'DEMO SEQUENCE'}
            </span>
            <button data-hot onClick={()=>!running && start()} disabled={running}
              className="px-5 py-2.5 rounded-full border border-neon/35 bg-neon/[.06] hover:bg-neon/[.12] disabled:opacity-40
                         font-mono text-[10.5px] tracking-[.14em] text-bone transition-colors">
              {running ? 'RUNNING…' : 'REPLAY'}
            </button>
          </div>
        </div>

        {!isLive && backend!=='checking' && (
          <p className="mb-8 font-mono text-[11px] text-smoke leading-relaxed max-w-[80ch] border-l border-flare/40 pl-4">
            Backend not detected on 127.0.0.1:8000 — this panel is replaying a recorded council transcript.
            Start <span className="text-flare">python server.py</span> and reload to stream live model output instead.
          </p>
        )}

        <div className="grid grid-cols-1 xl:grid-cols-12 gap-4">
          {/* decision tree */}
          <div className="xl:col-span-7 rounded-2xl border border-white/[.07] bg-void/60 p-6 md:p-8 overflow-hidden">
            <div className="flex items-center justify-between mb-6">
              <span className="font-mono text-[10px] tracking-ultra text-smoke">EXECUTION GRAPH</span>
              <span className="font-mono text-[10px] text-neon tabular-nums">{elapsed.toFixed(1)}s</span>
            </div>
            <svg viewBox="0 0 740 300" className="w-full h-auto">
              <defs>
                <linearGradient id="eg" x1="0" x2="1">
                  <stop offset="0%" stopColor="#00F2FE" stopOpacity=".9"/>
                  <stop offset="100%" stopColor="#4FACFE" stopOpacity=".35"/>
                </linearGradient>
                <filter id="gl"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
              </defs>

              {EDGES.map(([a,b],i)=>{
                const A=TREE.find(n=>n.id===a), B=TREE.find(n=>n.id===b);
                const lit = done.includes(a) && done.includes(b);
                const mx=(A.x+B.x)/2;
                return (
                  <path key={i} d={`M${A.x+34},${A.y} C${mx},${A.y} ${mx},${B.y} ${B.x-34},${B.y}`}
                    fill="none" stroke={lit?'url(#eg)':'rgba(255,255,255,.09)'} strokeWidth={lit?1.8:1}
                    strokeDasharray="360" strokeDashoffset={lit?0:360}
                    style={{transition:'stroke-dashoffset .8s ease, stroke .4s'}}/>
                );
              })}

              {TREE.map(n=>{
                const lit = done.includes(n.id), act = stage===n.id;
                return (
                  <g key={n.id} style={{transition:'opacity .4s'}} opacity={lit?1:.32}>
                    {act && <circle cx={n.x} cy={n.y} r="30" fill="none" stroke="#00F2FE" strokeWidth="1" opacity=".5">
                      <animate attributeName="r" values="24;40;24" dur="1.7s" repeatCount="indefinite"/>
                      <animate attributeName="opacity" values=".55;0;.55" dur="1.7s" repeatCount="indefinite"/>
                    </circle>}
                    <circle cx={n.x} cy={n.y} r="23" fill={lit?'rgba(0,242,254,.09)':'rgba(255,255,255,.02)'}
                      stroke={lit?'#00F2FE':'rgba(255,255,255,.14)'} strokeWidth="1.2"
                      filter={act?'url(#gl)':undefined} style={{transition:'all .45s'}}/>
                    {lit
                      ? <path d={`M${n.x-6},${n.y} l4,4 l7,-8`} fill="none" stroke="#00F2FE" strokeWidth="1.8" strokeLinecap="round"/>
                      : <circle cx={n.x} cy={n.y} r="3" fill="rgba(255,255,255,.22)"/>}
                    <text x={n.x} y={n.y+42} textAnchor="middle" fill={lit?'#EDEFF3':'#4A5364'}
                      style={{font:'500 11px "JetBrains Mono", monospace',letterSpacing:'.05em',transition:'fill .4s'}}>{n.label}</text>
                    <text x={n.x} y={n.y+57} textAnchor="middle" fill="#4A5364"
                      style={{font:'400 9.5px "JetBrains Mono", monospace'}}>{n.detail}</text>
                  </g>
                );
              })}
            </svg>
          </div>

          {/* terminal */}
          <div className="xl:col-span-5 rounded-2xl border border-white/[.07] bg-void/80 overflow-hidden flex flex-col">
            <div className="flex items-center gap-3 px-5 py-3.5 border-b border-white/[.07]">
              <span className="text-smoke"><Icons.Terminal size={13}/></span>
              <span className="font-mono text-[10px] tracking-[.14em] text-smoke">council.stream</span>
              <span className="ml-auto flex gap-1.5">
                {['#FF5F57','#FEBC2E','#28C840'].map(c=><span key={c} className="w-2 h-2 rounded-full" style={{background:c,opacity:.55}}/>)}
              </span>
            </div>
            <div ref={logRef} className="flex-1 min-h-[320px] max-h-[420px] overflow-y-auto p-5 font-mono text-[11.5px] leading-[1.75] space-y-2.5">
              {lines.map((l,i)=>(
                <motion.div key={i} initial={{opacity:0,x:-10}} animate={{opacity:1,x:0}} transition={{duration:.28}}
                  className={
                    l.t==='pros'?'text-rose-400':l.t==='def'?'text-emerald-400':l.t==='cor'?'text-volt':
                    l.t==='verd'?'text-neon font-bold':l.t==='ok'?'text-emerald-400 pl-3 border-l border-emerald-400/40':
                    l.t==='done'?'text-neon':l.t==='dim'?'text-smoke':'text-dust'}>
                  {l.text}
                </motion.div>
              ))}
              {running && <span className="inline-block w-[7px] h-[13px] bg-neon caret"/>}
              {!running && lines.length>0 && (
                <motion.div initial={{opacity:0}} animate={{opacity:1}}
                  className="flex items-center gap-2.5 pt-4 mt-2 border-t border-white/[.07] text-emerald-400">
                  <Icons.Check size={14}/><span>cycle complete · {elapsed.toFixed(1)}s</span>
                </motion.div>
              )}
            </div>
          </div>
        </div>
      </div>
    </section>
  );
}

      </div>
    </footer>
  );
}
